{% extends "../base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <span class="brand-pill">NHL Payroll</span>
        <h2>Welcome back</h2>
        <p>Sign in to continue to your payroll dashboard.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-success">Log In</button>
        </form>

        <div class="auth-links">
            <span>Need an account?</span>
            <a href="{% url 'sign_up_page' %}">Create one</a>
        </div>
    </div>
</div>
{% endblock content %}
