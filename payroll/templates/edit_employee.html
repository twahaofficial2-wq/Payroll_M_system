{% extends "./base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="page-shell edit-shell">
    <div class="page-header">
        <div>
            <h1>Edit employee</h1>
            <p>Update {{ employee.First_name }} {{ employee.last_name }}'s employee record.</p>
        </div>
        <a class="btn btn-outline-secondary" href="{% url 'add_employee_page' %}">Back to employees</a>
    </div>
    <div class="card form-card edit-form-card">
        <form method="POST">
            {% csrf_token %}
            {{form|crispy}}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save changes</button>
                <a href="{% url 'add_employee_page' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
